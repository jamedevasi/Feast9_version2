<label>Full name<input type="text" name="name" value="{{ doctor.name or '' }}" required placeholder="e.g. Dr. Anjali Rao"></label>
<label>Qualifications<input type="text" name="qualifications" value="{{ doctor.qualifications or '' }}" placeholder="e.g. BDS, MDS (Endodontics)"></label>
<label>Registration number<input type="text" name="registration_number" value="{{ doctor.registration_number or '' }}" placeholder="As on the registration certificate"></label>
<label>Registered with<input type="text" name="registration_council" value="{{ doctor.registration_council or 'Dental Council of Kerala' }}"></label>
<label>Calendar Colour<input type="color" name="color" value="{{ doctor.color or suggested_color or '#1c7ed6' }}"></label>
