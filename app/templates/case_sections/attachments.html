<section class="card">
  <h2>Clinical Attachments</h2>
  {% if attachments %}
  <ul class="entry-list">
    {% for a in attachments %}
    <li class="attachment-row">
      <div>
        <a href="{{ url_for('clinical.serve_attachment', attachment_id=a.id) }}" target="_blank" rel="noopener">{{ a.original_name }}</a>
        <span class="badge badge-closed">{{ a.file_type }}</span>
        {% if a.description %}<p>{{ a.description }}</p>{% endif %}
        <span class="entry-date">{{ a.uploaded_at }}</span>
      </div>
      <form method="post" action="{{ url_for('clinical.delete_attachment', attachment_id=a.id) }}" onsubmit="return confirm('Delete this attachment?');">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="button button-secondary">Delete</button>
      </form>
    </li>
    {% endfor %}
  </ul>
  {% else %}
  <p class="empty-state">No attachments uploaded yet.</p>
  {% endif %}

  <form method="post" action="{{ url_for('clinical.upload_attachment', case_id=case.id) }}" class="inline-form" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>File (JPG, PNG, or PDF)<input type="file" name="file" accept="image/jpeg,image/png,application/pdf" required></label>
    <label>Type
      <select name="file_type">
        {% for t in attachment_types %}
        <option value="{{ t }}">{{ t }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Description<input type="text" name="description" placeholder="Optional"></label>
    <button type="submit">Upload</button>
  </form>
</section>
